name: SIG bot scan/trade

on:
  # Cron is UTC. This broad weekday window covers 9:30am-4pm US Eastern in
  # both DST and standard time; the scheduled step below gates by local time.
  schedule:
    - cron: "30 13-21 * * 1-5"

  workflow_dispatch:
    inputs:
      live:
        description: "Place real orders this run? Type true or false"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate API configuration
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
        run: |
          if [ -z "$SIG_API_KEY" ]; then
            echo "::error::SIG_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "SIG_API_KEY is configured."

      - name: Run scheduled scan
        if: github.event_name == 'schedule'
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
          SIG_TOURNAMENT_SLUG: ${{ vars.SIG_TOURNAMENT_SLUG }}
        run: |
          local_weekday="$(TZ=America/New_York date +%u)"
          local_date="$(TZ=America/New_York date +%F)"
          local_hhmm="$(TZ=America/New_York date +%H%M)"
          echo "New York market time: $(TZ=America/New_York date '+%A %H:%M %Z')"
          if [[ "$local_date" < "2026-10-01" || "$local_date" > "2026-11-04" ]]; then
            echo "Outside competition dates (Oct 1-Nov 4, 2026 Eastern); skipping."
            exit 0
          fi
          if { [ "$local_date" = "2026-10-01" ] && [ "$local_hhmm" -lt 1200 ]; } ||
             { [ "$local_date" = "2026-11-04" ] && [ "$local_hhmm" -ge 1200 ]; }; then
            echo "Outside competition hours (noon Eastern start/end); skipping."
            exit 0
          fi
          if [ "$local_weekday" -gt 5 ] || [ "$local_hhmm" -lt 0930 ] || [ "$local_hhmm" -ge 1600 ]; then
            echo "Outside weekday U.S. market hours (9:30am-4:00pm Eastern); skipping."
            exit 0
          fi
          python bot.py scan \
            --tournament "$SIG_TOURNAMENT_SLUG" \
            --beliefs beliefs.json \
            --min-price 0.30 \
            --max-price 0.70 \
            --top 25

      - name: Run manual scan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.live != 'true'
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
          SIG_TOURNAMENT_SLUG: ${{ vars.SIG_TOURNAMENT_SLUG }}
        run: |
          python bot.py scan \
            --tournament "$SIG_TOURNAMENT_SLUG" \
            --beliefs beliefs.json \
            --min-price 0.30 \
            --max-price 0.70 \
            --top 25

      - name: Run manual live trade
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true'
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
          SIG_TOURNAMENT_SLUG: ${{ vars.SIG_TOURNAMENT_SLUG }}
          SIG_BOT_CONFIRM_LIVE: YES-I-UNDERSTAND-THIS-IS-LIVE
        run: |
          python bot.py trade \
            --tournament "$SIG_TOURNAMENT_SLUG" \
            --beliefs beliefs.json \
            --min-price 0.30 \
            --max-price 0.70 \
            --top 10 \
            --live

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}
          path: run_log.jsonl
          if-no-files-found: ignore
